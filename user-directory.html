<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Directory | Week 6</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="index.html">JavaScript Lab</a><span>Lesson 12 · Fetch API</span></header><main class="container"><a class="back" href="index.html">← Back to home</a><h1>User Directory</h1><p>Users are loaded from JSONPlaceholder. Search, sort, filter by city, and try a simulated POST request.</p>
<section class="panel"><div class="toolbar"><input id="search" type="text" placeholder="Search name or email"><select id="city-filter" aria-label="Filter by city"><option value="">All cities</option></select><select id="sort-order" aria-label="Sort by name"><option value="az">Name A–Z</option><option value="za">Name Z–A</option></select></div><p id="loading" class="status">Loading users…</p><p id="error" class="error hidden" role="alert"></p><div id="users-container" class="user-grid"></div></section>
<section class="panel"><h2>Create a demo post (POST)</h2><p class="muted">JSONPlaceholder simulates the request; it does not permanently save the post.</p><form id="post-form"><label for="post-title">Post title</label><input id="post-title" type="text" maxlength="100" required><label for="post-body">Post content</label><textarea id="post-body" required></textarea><button type="submit">Send POST request</button></form><p id="post-status" class="status" aria-live="polite"></p><pre id="post-result"></pre></section></main><script src="user-directory.js" defer></script></body></html>
